services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: souptask
      POSTGRES_USER: souptask
      POSTGRES_PASSWORD: souptask
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U souptask -d souptask"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    environment:
      DATABASE_URL: postgres://souptask:souptask@db:5432/souptask?sslmode=disable
      HTTP_ADDR: "0.0.0.0:8080"
      GRPC_ADDR: "0.0.0.0:9090"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"

  worker:
    scale: 4
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    entrypoint: ["/SoupWorker"]
    environment:
      DATABASE_URL: postgres://souptask:souptask@db:5432/souptask?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
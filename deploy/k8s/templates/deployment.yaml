apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-souptask
  labels:
    app.kubernetes.io/name: souptask
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: souptask
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: souptask
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: HTTP_ADDR
              value: "0.0.0.0:8080"
            - name: GRPC_ADDR
              value: "0.0.0.0:9090"
            {{- range $key, $parameter := .Values.rtc }}
            - name: {{ $key | upper | quote }}
              value: {{ printf "%v" $parameter.value | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090

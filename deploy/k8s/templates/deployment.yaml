apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-souptask
  labels:
    app.kubernetes.io/name: souptask
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: souptask
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: souptask
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: HTTP_ADDR
              value: "0.0.0.0:8080"
            - name: GRPC_ADDR
              value: "0.0.0.0:9090"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: url
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090

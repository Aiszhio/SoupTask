version: v2
plugins:
  - local: protoc-gen-go
    out: pkg/api
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: pkg/api
    opt: paths=source_relative
  - local: protoc-gen-grpc-gateway
    out: pkg/api
    strategy: all
    opt:
      - paths=source_relative
      - grpc_api_configuration=api/http.yaml


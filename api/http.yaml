type: google.api.Service
config_version: 3
http:
  rules:
    - selector: jobs.v1.JobService.CreateJob
      post: /v1/jobs
      body: "*"
    - selector: jobs.v1.JobService.GetJob
      get: /v1/jobs/{job_id}
    - selector: jobs.v1.JobService.ListJobs
      get: /v1/jobs
    - selector: jobs.v1.JobService.CancelJob
      post: "/v1/jobs/{job_id}:cancel"
